<svg width="700" height="310" viewBox="0 0 700 310" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo','Malgun Gothic',ui-sans-serif,sans-serif">
  <rect width="700" height="310" fill="#ffffff"/>

  <text x="280" y="25" font-size="17" font-weight="700" fill="#24292f" text-anchor="middle">팰린드롬 판별 — 투 포인터 ("level")</text>

  <!-- legend -->
  <line x1="500" y1="10" x2="520" y2="10" stroke="#0969da" stroke-width="3"/>
  <text x="526" y="14" font-size="12" fill="#24292f">left</text>
  <line x1="565" y1="10" x2="585" y2="10" stroke="#8250df" stroke-width="3"/>
  <text x="591" y="14" font-size="12" fill="#24292f">right</text>
  <line x1="635" y1="10" x2="655" y2="10" stroke="#1a7f37" stroke-width="3"/>
  <text x="661" y="14" font-size="12" fill="#24292f">일치</text>

  <!-- boxes -->
  <g font-family="monospace" font-size="28" text-anchor="middle">
    <rect x="110" y="110" width="70" height="70" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
    <text x="145" y="155" fill="#0550ae">l</text>

    <rect x="200" y="110" width="70" height="70" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
    <text x="235" y="155" fill="#0550ae">e</text>

    <rect x="290" y="110" width="70" height="70" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
    <text x="325" y="155" fill="#0550ae">v</text>

    <rect x="380" y="110" width="70" height="70" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
    <text x="415" y="155" fill="#0550ae">e</text>

    <rect x="470" y="110" width="70" height="70" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
    <text x="505" y="155" fill="#0550ae">l</text>
  </g>

  <!-- match arcs (accumulate, default visible as static fallback) -->
  <path d="M145,110 Q325,45 505,110" fill="none" stroke="#1a7f37" stroke-width="2.5" opacity="1">
    <animate attributeName="opacity" values="0;0;1;1;0;0"
      keyTimes="0;0.0667;0.1111;0.8333;0.8889;1"
      dur="9s" begin="0s" repeatCount="indefinite"/>
  </path>

  <path d="M235,110 Q325,75 415,110" fill="none" stroke="#1a7f37" stroke-width="2.5" opacity="1">
    <animate attributeName="opacity" values="0;0;1;1;0;0"
      keyTimes="0;0.2333;0.2778;0.8333;0.8889;1"
      dur="9s" begin="0s" repeatCount="indefinite"/>
  </path>

  <!-- pointers -->
  <g transform="translate(145,0)">
    <animateTransform attributeName="transform" type="translate"
      values="145,0;145,0;235,0;235,0;310,0;310,0;145,0;145,0"
      keyTimes="0;0.1444;0.2;0.3111;0.3667;0.8333;0.8889;1"
      dur="9s" begin="0s" repeatCount="indefinite"/>
    <polygon points="0,185 -10,205 10,205" fill="#0969da"/>
    <text x="0" y="222" font-size="13" fill="#0969da" text-anchor="middle">left</text>
  </g>

  <g transform="translate(505,0)">
    <animateTransform attributeName="transform" type="translate"
      values="505,0;505,0;415,0;415,0;340,0;340,0;505,0;505,0"
      keyTimes="0;0.1444;0.2;0.3111;0.3667;0.8333;0.8889;1"
      dur="9s" begin="0s" repeatCount="indefinite"/>
    <polygon points="0,185 -10,205 10,205" fill="#8250df"/>
    <text x="0" y="222" font-size="13" fill="#8250df" text-anchor="middle">right</text>
  </g>

  <!-- middle box marker -->
  <text x="350" y="252" font-size="13" fill="#57606a" text-anchor="middle" opacity="1">
    가운데 도달 — left ≥ right, 종료
    <animate attributeName="opacity" values="0;0;1;1;0;0"
      keyTimes="0;0.4;0.4444;0.8333;0.8889;1"
      dur="9s" begin="0s" repeatCount="indefinite"/>
  </text>

  <!-- result -->
  <text x="350" y="285" font-size="18" font-weight="700" fill="#116329" text-anchor="middle" opacity="1">
    팰린드롬입니다!
    <animate attributeName="opacity" values="0;0;1;1;0;0"
      keyTimes="0;0.4889;0.5333;0.8333;0.8889;1"
      dur="9s" begin="0s" repeatCount="indefinite"/>
  </text>
</svg>
