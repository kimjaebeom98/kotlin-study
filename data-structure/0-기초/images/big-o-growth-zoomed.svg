<svg width="800" height="330" viewBox="0 0 800 330" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo','Malgun Gothic',ui-sans-serif,sans-serif">
  <rect width="800" height="330" fill="#ffffff"/>

  <text x="400" y="25" font-size="18" font-weight="700" fill="#24292f" text-anchor="middle">O(1) · O(log n) · O(n) 확대 비교 (n = 1~20)</text>

  <line x1="60" y1="280" x2="750" y2="280" stroke="#24292f" stroke-width="1.5"/>
  <line x1="60" y1="280" x2="60" y2="35" stroke="#24292f" stroke-width="1.5"/>
  <text x="750" y="302" font-size="13" fill="#57606a" text-anchor="end">n (입력 크기)</text>
  <text x="30" y="55" font-size="13" fill="#57606a" text-anchor="start">연산 횟수</text>

  <!-- O(1) -->
  <line x1="60" y1="270.4" x2="740" y2="270.4" stroke="#8c959f" stroke-width="2.5"/>

  <!-- O(log n) -->
  <polyline points="60.0,280.0 95.8,270.4 167.4,260.8 238.9,255.2 310.5,251.2 382.1,248.1 453.7,245.6 525.3,243.4 596.8,241.6 668.4,240.0 740.0,238.5"
            fill="none" stroke="#1a7f37" stroke-width="2.5"/>

  <!-- O(n) -->
  <polyline points="60.0,270.4 95.8,260.8 167.4,241.6 238.9,222.4 310.5,203.2 382.1,184.0 453.7,164.8 525.3,145.6 596.8,126.4 668.4,107.2 740.0,88.0"
            fill="none" stroke="#0969da" stroke-width="2.5"/>

  <g font-size="14">
    <line x1="90" y1="55" x2="120" y2="55" stroke="#8c959f" stroke-width="3"/>
    <text x="128" y="59" fill="#24292f">O(1)</text>

    <line x1="90" y1="77" x2="120" y2="77" stroke="#1a7f37" stroke-width="3"/>
    <text x="128" y="81" fill="#24292f">O(log n)</text>

    <line x1="90" y1="99" x2="120" y2="99" stroke="#0969da" stroke-width="3"/>
    <text x="128" y="103" fill="#24292f">O(n)</text>
  </g>
</svg>
