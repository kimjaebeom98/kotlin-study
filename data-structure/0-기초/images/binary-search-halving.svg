<svg width="700" height="230" viewBox="0 0 700 230" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo','Malgun Gothic',ui-sans-serif,sans-serif">
  <rect width="700" height="230" fill="#ffffff"/>

  <!-- row 1 -->
  <text x="160" y="46" font-size="13" fill="#57606a" text-anchor="end">1번째</text>
  <rect x="170" y="30" width="480" height="24" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="660" y="46" font-size="13" fill="#24292f">1,000,000개</text>

  <!-- row 2 -->
  <text x="160" y="80" font-size="13" fill="#57606a" text-anchor="end">2번째</text>
  <rect x="170" y="64" width="240" height="24" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="420" y="80" font-size="13" fill="#24292f">500,000개</text>

  <!-- row 3 -->
  <text x="160" y="114" font-size="13" fill="#57606a" text-anchor="end">3번째</text>
  <rect x="170" y="98" width="120" height="24" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="300" y="114" font-size="13" fill="#24292f">250,000개</text>

  <!-- row 4 -->
  <text x="160" y="148" font-size="13" fill="#57606a" text-anchor="end">4번째</text>
  <rect x="170" y="132" width="60" height="24" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="240" y="148" font-size="13" fill="#24292f">125,000개</text>

  <!-- ellipsis -->
  <text x="200" y="176" font-size="16" fill="#57606a">⋮ (계속 절반씩)</text>

  <!-- final row -->
  <text x="160" y="204" font-size="13" fill="#57606a" text-anchor="end">20번째</text>
  <rect x="170" y="188" width="8" height="24" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="188" y="204" font-size="13" font-weight="700" fill="#116329">1개 — 여기서 찾음</text>
</svg>
