<svg width="800" height="420" viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo','Malgun Gothic',ui-sans-serif,sans-serif">
  <rect width="800" height="420" fill="#ffffff"/>

  <text x="400" y="25" font-size="18" font-weight="700" fill="#24292f" text-anchor="middle">입력 크기(n)에 따른 연산 횟수 비교 (n = 1~20)</text>

  <!-- axes: n=1 starts exactly at the y-axis (x=60) -->
  <line x1="60" y1="340" x2="750" y2="340" stroke="#24292f" stroke-width="1.5"/>
  <line x1="60" y1="340" x2="60" y2="35" stroke="#24292f" stroke-width="1.5"/>
  <text x="750" y="362" font-size="13" fill="#57606a" text-anchor="end">n (입력 크기)</text>
  <text x="30" y="60" font-size="13" fill="#57606a" text-anchor="start">연산 횟수</text>

  <!-- O(1) -->
  <line x1="60" y1="339.2" x2="740" y2="339.2" stroke="#8c959f" stroke-width="2.5"/>

  <!-- O(log n) -->
  <polyline points="60.0,340.0 95.8,339.2 167.4,338.5 238.9,338.1 310.5,337.8 382.1,337.5 453.7,337.3 525.3,337.1 596.8,337.0 668.4,336.9 740.0,336.8"
            fill="none" stroke="#1a7f37" stroke-width="2.5"/>

  <!-- O(n) -->
  <polyline points="60.0,339.2 95.8,338.5 167.4,337.0 238.9,335.5 310.5,334.0 382.1,332.5 453.7,331.0 525.3,329.5 596.8,328.0 668.4,326.5 740.0,325.0"
            fill="none" stroke="#0969da" stroke-width="2.5"/>

  <!-- O(n log n) -->
  <polyline points="60.0,340.0 95.8,338.5 167.4,334.0 238.9,328.4 310.5,322.0 382.1,315.1 453.7,307.7 525.3,300.0 596.8,292.0 668.4,283.7 740.0,275.2"
            fill="none" stroke="#8250df" stroke-width="2.5"/>

  <!-- O(n^2) -->
  <polyline points="60.0,339.2 95.8,337.0 167.4,328.0 238.9,313.0 310.5,292.0 382.1,265.0 453.7,232.0 525.3,193.0 596.8,148.0 668.4,97.0 740.0,40.0"
            fill="none" stroke="#cf222e" stroke-width="2.5"/>

  <!-- legend -->
  <g font-size="14">
    <line x1="90" y1="55" x2="120" y2="55" stroke="#8c959f" stroke-width="3"/>
    <text x="128" y="59" fill="#24292f">O(1)</text>

    <line x1="90" y1="77" x2="120" y2="77" stroke="#1a7f37" stroke-width="3"/>
    <text x="128" y="81" fill="#24292f">O(log n)</text>

    <line x1="90" y1="99" x2="120" y2="99" stroke="#0969da" stroke-width="3"/>
    <text x="128" y="103" fill="#24292f">O(n)</text>

    <line x1="90" y1="121" x2="120" y2="121" stroke="#8250df" stroke-width="3"/>
    <text x="128" y="125" fill="#24292f">O(n log n)</text>

    <line x1="90" y1="143" x2="120" y2="143" stroke="#cf222e" stroke-width="3"/>
    <text x="128" y="147" fill="#24292f">O(n²)</text>
  </g>

  <text x="400" y="395" font-size="12" fill="#8c959f" text-anchor="middle">O(1)·O(log n)·O(n) 세 개는 이 스케일에서 거의 구분이 안 됨 — 아래 확대 그래프 참고</text>
</svg>
