<svg width="700" height="420" viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo','Malgun Gothic',ui-sans-serif,sans-serif">
  <rect width="700" height="420" fill="#ffffff"/>

  <text x="350" y="28" font-size="17" font-weight="700" fill="#24292f" text-anchor="middle">factorial(4) 호출 — 콜스택이 쌓였다 풀리는 과정</text>

  <text x="640" y="115" font-size="12" fill="#57606a" text-anchor="middle">↑ top</text>
  <line x1="150" y1="350" x2="590" y2="350" stroke="#24292f" stroke-width="1.5"/>
  <text x="150" y="368" font-size="12" fill="#57606a" text-anchor="start">스택 바닥</text>

  <!-- box1: factorial(4) -->
  <g opacity="1">
    <animateTransform attributeName="transform" type="translate"
      values="0,30;0,30;0,0;0,0;0,-30;0,-30"
      keyTimes="0;0.0222;0.0556;0.8;0.8333;1"
      dur="9s" begin="0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0"
      keyTimes="0;0.0222;0.0556;0.8;0.8333;1"
      dur="9s" begin="0s" repeatCount="indefinite"/>
    <rect x="170" y="300" width="380" height="45" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
    <text x="190" y="328" font-size="16" fill="#0550ae" font-family="monospace">factorial(4)</text>
    <text x="530" y="328" font-size="16" font-weight="700" fill="#0550ae" text-anchor="end" opacity="0">
      = 24
      <animate attributeName="opacity" values="0;0;1;1;0;0"
        keyTimes="0;0.7278;0.7444;0.8;0.8333;1"
        dur="9s" begin="0s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- box2: factorial(3) -->
  <g opacity="1">
    <animateTransform attributeName="transform" type="translate"
      values="0,30;0,30;0,0;0,0;0,-30;0,-30"
      keyTimes="0;0.1333;0.1667;0.7111;0.7444;1"
      dur="9s" begin="0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0"
      keyTimes="0;0.1333;0.1667;0.7111;0.7444;1"
      dur="9s" begin="0s" repeatCount="indefinite"/>
    <rect x="170" y="245" width="380" height="45" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
    <text x="190" y="273" font-size="16" fill="#0550ae" font-family="monospace">factorial(3)</text>
    <text x="530" y="273" font-size="16" font-weight="700" fill="#0550ae" text-anchor="end" opacity="0">
      = 6
      <animate attributeName="opacity" values="0;0;1;1;0;0"
        keyTimes="0;0.6389;0.6556;0.7111;0.7444;1"
        dur="9s" begin="0s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- box3: factorial(2) -->
  <g opacity="1">
    <animateTransform attributeName="transform" type="translate"
      values="0,30;0,30;0,0;0,0;0,-30;0,-30"
      keyTimes="0;0.2444;0.2778;0.6222;0.6556;1"
      dur="9s" begin="0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0"
      keyTimes="0;0.2444;0.2778;0.6222;0.6556;1"
      dur="9s" begin="0s" repeatCount="indefinite"/>
    <rect x="170" y="190" width="380" height="45" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
    <text x="190" y="218" font-size="16" fill="#0550ae" font-family="monospace">factorial(2)</text>
    <text x="530" y="218" font-size="16" font-weight="700" fill="#0550ae" text-anchor="end" opacity="0">
      = 2
      <animate attributeName="opacity" values="0;0;1;1;0;0"
        keyTimes="0;0.55;0.5667;0.6222;0.6556;1"
        dur="9s" begin="0s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- box4: factorial(1) - base case -->
  <g opacity="1">
    <animateTransform attributeName="transform" type="translate"
      values="0,30;0,30;0,0;0,0;0,-30;0,-30"
      keyTimes="0;0.3556;0.3889;0.5333;0.5667;1"
      dur="9s" begin="0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0"
      keyTimes="0;0.3556;0.3889;0.5333;0.5667;1"
      dur="9s" begin="0s" repeatCount="indefinite"/>
    <rect x="170" y="135" width="380" height="45" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
    <text x="190" y="163" font-size="16" fill="#116329" font-family="monospace">factorial(1) — 종료 조건</text>
    <text x="530" y="163" font-size="16" font-weight="700" fill="#116329" text-anchor="end" opacity="0">
      = 1
      <animate attributeName="opacity" values="0;0;1;1;0;0"
        keyTimes="0;0.4611;0.4778;0.5333;0.5667;1"
        dur="9s" begin="0s" repeatCount="indefinite"/>
    </text>
  </g>

  <text x="350" y="400" font-size="13" fill="#57606a" text-anchor="middle">아래에서 위로 쌓이고(push) → 맨 위(가장 나중에 호출된 것)부터 차례로 풀린다(pop)</text>
</svg>
